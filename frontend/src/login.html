<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Ariadne - Login (Pixel Art)</title>
<style>
  @font-face {
    font-family: 'Fusion Pixel';
    src: url('fusion-pixel-10px-monospaced-latin.ttf.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Fusion Pixel';
    src: url('fusion-pixel-10px-monospaced-zh_hans.ttf.woff2') format('woff2');
    unicode-range: U+3000-303F, U+4E00-9FFF, U+3400-4DBF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF;
  }
  body {
    background-color: #2ba272;
    background-image: 
      radial-gradient(#208a5e 2px, transparent 2px),
      radial-gradient(#208a5e 2px, transparent 2px);
    background-size: 40px 40px;
    background-position: 0 0, 20px 20px;
    font-family: 'Fusion Pixel', monospace, sans-serif;
    display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
  }
  .card {
    background: #ffffff;
    border: 4px solid #0f3d2a;
    border-radius: 12px;
    box-shadow: 8px 8px 0px #0f3d2a;
    padding: 40px; text-align: center; width: 320px;
  }
  h1 { color: #eb7a7a; font-size: 32px; margin: 0 0 10px; text-shadow: 2px 2px 0px #bce1ce; letter-spacing: 2px;}
  p { color: #555; font-size: 14px; margin-bottom: 30px; font-weight: bold;}
  input {
    width: 85%; padding: 12px; margin-bottom: 20px;
    border: 3px solid #bce1ce; border-radius: 6px;
    font-family: 'Fusion Pixel', monospace; outline: none;
    box-shadow: inset 2px 2px 0px #eaf6f0;
  }
  input:focus { border-color: #0f3d2a; }
  button {
    width: 100%; padding: 15px; 
    background: #178351; color: white;
    border: 3px solid #0f3d2a; border-radius: 6px;
    box-shadow: 4px 4px 0px #0f3d2a;
    font-family: 'Fusion Pixel', monospace; font-size: 18px;
    cursor: pointer; transition: all 0.1s; margin-top: 10px;
  }
  button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #0f3d2a; }
</style>
</head>
<body>
  <div class="card">
    <h1>Ariadne</h1>
    <p>循此红线，洞见万卷</p>
    <input type="text" placeholder="输入行者名称">
    <input type="password" placeholder="输入通路密钥">
    <button>循线破局</button>
  </div>
</body>
</html>
